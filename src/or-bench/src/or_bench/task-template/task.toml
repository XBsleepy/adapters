schema_version = "1.0"

[task]
name = "bench-llm/or-bench__{task_id}"
authors = [
    { name = "Justin Cui" },
    { name = "Wei-Lin Chiang" },
    { name = "Ion Stoica" },
    { name = "Cho-Jui Hsieh" },
]
keywords = ["safety", "over-refusal", "{subset}"]

[metadata]
difficulty = "easy"
category = "safety"
subset = "{subset}"
prompt_category = "{category}"
expected_behavior = "{expected_behavior}"
judge = "{judge}"

# The verifier runs in the agent's container after the agent finishes; tests/
# (grader and ground_truth.json) is copied in only at that point.
{verifier}
[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
